name: Planning Center (set lengths, by hand only)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set item lengths in the one plan named in pco_updates.json
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
        run: python scripts/pco_update.py
      - name: Refresh planning.json
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
        run: python scripts/pco_fetch.py
      - name: Save the results
        run: |
          git config user.name "start-times-bot"
          git config user.email "start-times-bot@users.noreply.github.com"
          git add pco_update_result.json planning.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Planning Center: set lengths from ProTools" && git push; fi
